services:
  db:
    image: postgres:15
    container_name: phishing_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phishing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: phishing_backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your shell or a .env file next to docker-compose.yml}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/phishing_db
      - FRONTEND_ORIGINS=http://localhost:5173
      - VT_API_KEY=${VT_API_KEY:-}
      - URLHAUS_AUTH_KEY=${URLHAUS_AUTH_KEY:-}
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    container_name: phishing_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
