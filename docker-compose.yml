version: '3.8'

services:
  db:
    image: postgres:15
    container_name: phishing_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: phishing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7
    container_name: phishing_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: phishing_backend
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=phishing_db
    depends_on:
      - db
      - redis
    restart: always

  frontend:
    build: ./frontend
    container_name: phishing_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
